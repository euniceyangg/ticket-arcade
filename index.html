<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  :root {
    --bg: #c9f23d;        /* Kirby lime */
    --dot: #b4de2c;
    --panel: #fff4fa;     /* soft pink-white */
    --pink: #ff7eb6;
    --hot: #ff4f9a;
    --mint: #a8dcc4;      /* Sims sage-mint */
    --gb-dark: #0f380f;   /* Game Boy greens */
    --gb-mid: #306230;
    --gb-light: #9bbc0f;
    --gb-pale: #c4d96a;
    --ink: #4a2b3d;       /* outline brown-plum */
    --accent: #ffd23f;
    --bad: #ff5d73;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 22px/1.25 'VT323', monospace; min-height: 100vh;
    background: var(--bg) radial-gradient(var(--dot) 2px, transparent 2px) 0 0 / 16px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px;
    background: var(--hot) repeating-linear-gradient(135deg, #0000 0 10px, #fff2 10px 20px);
    border-bottom: 4px solid var(--ink); position: sticky; top: 0; z-index: 5; }
  header h1 { font: 14px/1.4 'Press Start 2P', monospace; margin: 0 auto 0 0; color: #fff; text-shadow: 2px 2px 0 var(--ink); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a, button { font: inherit; color: var(--ink); background: var(--mint); border: 3px solid var(--ink); border-radius: 10px;
    padding: 4px 12px; cursor: pointer; text-decoration: none; box-shadow: 0 3px 0 var(--ink); }
  nav a:active, button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
  nav a.on { background: var(--accent); }
  button.primary { background: var(--accent); font-weight: bold; }
  button:disabled { opacity: .45; cursor: not-allowed; background: #ddd; }
  .pill { background: var(--panel); border: 3px solid var(--ink); padding: 2px 12px; border-radius: 99px; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
  h2 { margin-top: 0; font: 16px/1.5 'Press Start 2P', monospace; color: var(--ink); text-shadow: 2px 2px 0 #fff; }
  h3 { font: 12px/1.5 'Press Start 2P', monospace; }
  a { color: var(--hot); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 4px solid var(--ink); border-radius: 16px; padding: 14px; text-align: center; box-shadow: 4px 4px 0 var(--ink); }
  .card:nth-child(3n+2) { background: #e8f8ef; }
  .card:nth-child(3n) { background: #fff3cf; }
  .card .big { font-size: 3rem; }
  .muted { opacity: .75; }
  input[type=text] { font: inherit; padding: 6px 10px; border-radius: 10px; border: 3px solid var(--ink); background: #fff; color: var(--ink); }
  .moles { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; justify-content: center; margin: 16px 0; padding: 16px;
    background: var(--gb-light); border: 4px solid var(--gb-dark); border-radius: 12px; width: max-content; margin-inline: auto; }
  .hole { width: 90px; height: 90px; border-radius: 50%; background: var(--gb-mid); border-color: var(--gb-dark); font-size: 2.6rem; display: grid; place-items: center; padding: 0; box-shadow: inset 0 6px 0 var(--gb-dark); }
  .react { height: 200px; border: 4px solid var(--gb-dark); border-radius: 12px; display: grid; place-items: center; font: 14px/1.6 'Press Start 2P', monospace; cursor: pointer; user-select: none; text-align: center; padding: 8px; color: var(--gb-dark); }
  table { width: 100%; border-collapse: collapse; background: var(--gb-pale); border: 4px solid var(--gb-dark); color: var(--gb-dark); }
  td, th { padding: 4px 10px; border-bottom: 2px solid var(--gb-mid); text-align: left; }
  .badge { opacity: .4; filter: grayscale(1); }
  .badge.got { opacity: 1; filter: none; }
  .tag { display: inline-block; font-size: .8rem; padding: 0 10px; border-radius: 99px; background: var(--bad); color: #fff; border: 2px solid var(--ink); }
  #rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  #rain span { position: absolute; top: -40px; font-size: 2rem; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink); border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 8px 16px; border-radius: 12px; display: none; z-index: 30; }
</style>
</head>
<body>
<header>
  <h1>🎟️ Ticket Arcade</h1>
  <nav id="nav"></nav>
  <span class="pill" id="who"></span>
  <span class="pill" id="tix"></span>
  <button id="mute" title="Toggle sound"></button>
</header>
<main id="app"></main>
<div id="rain"></div>
<div id="toast"></div>

<script>
// ---------- State (localStorage; swap load/save for Supabase later) ----------
const KEY = 'ticket-arcade-v1';
const PRIZES = [
  { id: 'eraser',  name: 'Star Eraser',      emoji: '🌟', cost: 10,  stock: null },
  { id: 'bouncy',  name: 'Bouncy Ball',      emoji: '🏀', cost: 25,  stock: null },
  { id: 'yoyo',    name: 'Glow Yo-Yo',       emoji: '🪀', cost: 50,  stock: null },
  { id: 'plush',   name: 'Plush Bear',       emoji: '🧸', cost: 120, stock: 5 },
  { id: 'robot',   name: 'Mini Robot',       emoji: '🤖', cost: 200, stock: 3 },
  { id: 'crown',   name: 'Golden Crown',     emoji: '👑', cost: 400, stock: 1 },
];
const GAMES = {}; // filled by Arcade.registerGame, see games/
const ACHIEVEMENTS = [
  { id: 'first',  name: 'First prize',        emoji: '🎁', test: s => Object.keys(s.owned).length > 0 },
  { id: 'every',  name: 'Played every game',  emoji: '🕹️', test: s => Object.keys(GAMES).every(g => s.played[g]) },
  { id: 'rich',   name: '100 tickets earned', emoji: '💰', test: s => s.earned >= 100 },
  { id: 'rare',   name: 'Rare find',          emoji: '💎', test: s => PRIZES.some(p => p.stock && s.owned[p.id]) },
];
const today = () => new Date().toISOString().slice(0, 10);

function fresh() {
  return { name: '', tickets: 0, earned: 0, owned: {}, played: {}, scores: {}, stock: {}, bonusDay: '', badges: {}, muted: false };
}
let S = (() => { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY))); } catch { return fresh(); } })();
PRIZES.forEach(p => { if (p.stock != null && S.stock[p.id] == null) S.stock[p.id] = p.stock; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2200); }

let ac;
function beep(freq = 440, dur = .1, type = 'square') {
  if (S.muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = .08;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch {}
}
const jingle = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .12), i * 90));

function rain(n) {
  const box = $('#rain');
  for (let i = 0; i < Math.min(n, 40); i++) {
    const s = document.createElement('span');
    s.textContent = '🎟️'; s.style.left = Math.random() * 100 + '%'; s.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(s); setTimeout(() => s.remove(), 2600);
  }
}

function checkBadges() {
  ACHIEVEMENTS.forEach(a => {
    if (!S.badges[a.id] && a.test(S)) { S.badges[a.id] = true; toast(`${a.emoji} Achievement: ${a.name}`); jingle(); }
  });
}

function award(game, score, tickets) {
  S.played[game] = true;
  S.tickets += tickets; S.earned += tickets;
  const board = (S.scores[game] = S.scores[game] || []);
  board.push({ name: S.name || 'Guest', score });
  board.sort((a, b) => b.score - a.score); board.length = Math.min(board.length, 5);
  checkBadges(); save(); renderHeader();
  if (tickets > 0) { rain(tickets); jingle(); }
}

// ---------- Header ----------
const ROUTES = { door: 'Door', games: 'Games', prizes: 'Prize Shop', shelf: 'Shelf', board: 'Leaderboard', badges: 'Badges' };
function renderHeader() {
  const r = location.hash.slice(2) || 'door';
  $('#nav').innerHTML = Object.entries(ROUTES).map(([k, v]) => `<a href="#/${k}" class="${r === k ? 'on' : ''}">${v}</a>`).join('');
  $('#who').textContent = S.name ? '👤 ' + S.name : '👤 Guest';
  $('#tix').textContent = '🎟️ ' + S.tickets;
  $('#mute').textContent = S.muted ? '🔇' : '🔊';
}
$('#mute').onclick = () => { S.muted = !S.muted; save(); renderHeader(); };

// ---------- Pages ----------
const pages = {};
let stopGame = () => {};

pages.door = el => {
  const canBonus = S.bonusDay !== today();
  el.innerHTML = `<h2>Welcome to the arcade!</h2>
    <p class="muted">Tell us your name, play games to win tickets, then spend them at the prize counter.</p>
    <p><input type="text" id="nm" maxlength="16" placeholder="Your name" value="${esc(S.name)}"> <button class="primary" id="go">Enter</button></p>
    <div class="card" style="max-width:320px">
      <div class="big">🎁</div><b>Daily bonus</b>
      <p class="muted">${canBonus ? 'Free 15 tickets today!' : 'Come back tomorrow.'}</p>
      <button class="primary" id="bonus" ${canBonus ? '' : 'disabled'}>Claim 15 tickets</button>
    </div>`;
  $('#go').onclick = () => { S.name = $('#nm').value.trim(); save(); location.hash = '#/games'; };
  $('#bonus').onclick = () => { S.bonusDay = today(); S.tickets += 15; S.earned += 15; rain(15); jingle(); checkBadges(); save(); renderHeader(); pages.door(el); };
};

pages.games = el => {
  el.innerHTML = `<h2>Games</h2><div class="grid">${Object.values(GAMES).map(g =>
    `<div class="card"><div class="big">${g.emoji}</div><b>${esc(g.name)}</b><p class="muted">${esc(g.blurb || '')}</p>
     <p class="muted">by ${esc(g.author || 'anonymous')}</p><button class="primary" data-g="${g.id}">Play</button></div>`).join('')}</div>`;
  el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { location.hash = '#/play-' + b.dataset.g; });
};

pages.prizes = el => {
  el.innerHTML = `<h2>Prize Shop</h2><div class="grid">${PRIZES.map(p => {
    const left = p.stock == null ? null : S.stock[p.id];
    const sold = left === 0, poor = S.tickets < p.cost;
    return `<div class="card"><div class="big">${p.emoji}</div><b>${p.name}</b>
      <p>🎟️ ${p.cost}</p>
      ${left != null ? `<p class="muted">${sold ? '<span class="tag">Sold out</span>' : left + ' left'}</p>` : '<p class="muted">&nbsp;</p>'}
      <button class="primary" data-p="${p.id}" ${sold || poor ? 'disabled' : ''}>${sold ? 'Sold out' : 'Buy'}</button></div>`;
  }).join('')}</div>`;
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const p = PRIZES.find(x => x.id === b.dataset.p);
    if (S.tickets < p.cost || (p.stock != null && S.stock[p.id] <= 0)) return;
    S.tickets -= p.cost; S.owned[p.id] = (S.owned[p.id] || 0) + 1;
    if (p.stock != null) S.stock[p.id]--;
    beep(520, .1); toast(`${p.emoji} You got a ${p.name}!`); checkBadges(); save(); renderHeader(); pages.prizes(el);
  });
};

pages.shelf = el => {
  const items = PRIZES.filter(p => S.owned[p.id]);
  el.innerHTML = `<h2>Prize Shelf</h2>` + (items.length
    ? `<div class="grid">${items.map(p => `<div class="card"><div class="big">${p.emoji}</div><b>${p.name}</b><p class="muted">× ${S.owned[p.id]}</p></div>`).join('')}</div>`
    : `<p class="muted">Nothing yet. Win some tickets and visit the Prize Shop!</p>`);
};

pages.board = el => {
  el.innerHTML = `<h2>Leaderboard</h2><p class="muted">Top 5 per game on this device.</p>` + Object.entries(GAMES).map(([g, game]) => {
    const label = game.name;
    const rows = S.scores[g] || [];
    return `<h3>${label}</h3>` + (rows.length ? `<table>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`).join('')}</table>` : '<p class="muted">No scores yet.</p>');
  }).join('');
};

pages.badges = el => {
  el.innerHTML = `<h2>Achievements</h2><div class="grid">${ACHIEVEMENTS.map(a =>
    `<div class="card badge ${S.badges[a.id] ? 'got' : ''}"><div class="big">${a.emoji}</div><b>${a.name}</b></div>`).join('')}</div>`;
};

// ---------- Router ----------
function route() {
  stopGame(); stopGame = () => {};
  const r = location.hash.slice(2) || 'door';
  renderHeader();
  const el = $('#app');
  if (r.startsWith('play-') && GAMES[r.slice(5)]) {
    const g = GAMES[r.slice(5)];
    el.innerHTML = `<h2>${g.emoji} ${esc(g.name)}</h2><div id="game"></div><p><a href="#/games">&larr; Back to games</a></p>`;
    stopGame = g.play($('#game'), {
      beep,
      finish: (score, tickets) => award(g.id, score, Math.max(0, Math.floor(tickets))),
    }) || (() => {});
    return;
  }
  (pages[r] || pages.door)(el);
}
addEventListener('hashchange', route);

// Games call Arcade.registerGame({...}); then start() renders the first page.
window.Arcade = {
  registerGame(g) { GAMES[g.id] = g; },
  start: route,
};
</script>

<!-- ADD YOUR GAME: drop a file in games/ and add one script tag below -->
<script src="games/mole.js"></script>
<script src="games/react.js"></script>
<script>Arcade.start();</script>
</body>
</html>
